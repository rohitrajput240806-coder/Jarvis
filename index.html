<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020914">
<title>JARVIS V3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at center,#073e5d,#020914 45%,#000308);color:#dff8ff;font-family:Arial,sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px}
.title{font-size:29px;letter-spacing:9px;color:#00d9ff;text-shadow:0 0 12px #00d9ff,0 0 30px #008cff}
.status{margin-top:6px;font-size:11px;letter-spacing:3px;color:#73eaff}
.hud{position:relative;width:min(68vw,280px);height:min(68vw,280px);margin:22px 0 16px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border:2px solid #00cfff;border-radius:50%;box-shadow:0 0 10px #00cfff,inset 0 0 15px #008cff}
.r1{width:100%;height:100%;animation:spin 12s linear infinite}
.r2{width:80%;height:80%;border-style:dashed;animation:rev 8s linear infinite}
.r3{width:60%;height:60%;animation:pulse 2s infinite}
.core{width:32%;height:32%;border-radius:50%;background:radial-gradient(circle,#fff,#00d9ff 28%,#006cff 62%,#00152a);box-shadow:0 0 20px #00eaff,0 0 60px #008cff;animation:pulse 1.5s infinite}
.chat{width:100%;max-width:560px;height:230px;overflow:auto;border:1px solid #008cff;border-radius:15px;background:rgba(0,15,30,.72);padding:13px;box-shadow:0 0 20px rgba(0,180,255,.2)}
.msg{padding:9px 11px;margin:7px 0;border-radius:10px;line-height:1.45;word-wrap:break-word}
.user{background:rgba(0,120,190,.22);border:1px solid rgba(0,207,255,.35)}
.jarvis{background:rgba(0,50,80,.32);border:1px solid rgba(0,140,255,.3)}
.controls{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{min-height:48px;border-radius:11px;border:1px solid #00cfff;background:rgba(0,100,180,.2);color:#dff8ff;font-weight:bold}
button:active{transform:scale(.97);background:rgba(0,190,255,.4)}
.row{width:100%;max-width:560px;display:flex;gap:7px;margin-top:9px}
input{flex:1;min-width:0;padding:13px;border-radius:11px;border:1px solid #008cff;background:#00101f;color:white;outline:none;font-size:15px}
.send{width:90px}
.hint{margin-top:8px;font-size:11px;color:#72c9df;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes rev{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes pulse{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<div class="app">
<div class="title">JARVIS</div>
<div class="status" id="status">V3 • SYSTEM ONLINE</div>

<div class="hud"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>

<div class="chat" id="chat">
<div class="msg jarvis"><b>JARVIS:</b> Hello. I am ready. Speak or type a command.</div>
</div>

<div class="controls">
<button onclick="listen()">🎙️ SPEAK</button>
<button onclick="searchPrompt()">🌐 SEARCH</button>
<button onclick="openYouTube()">▶️ YOUTUBE</button>
<button onclick="clearChat()">🧹 CLEAR</button>
</div>

<div class="row">
<input id="input" placeholder="Ask JARVIS..." onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">SEND</button>
</div>
<div class="hint">Try: hello • time • date • open youtube • search AI • who are you • Marathi/Hindi commands</div>
</div>

<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),status=document.getElementById("status");
let recognition=null;

function add(who,text,cls){
 const d=document.createElement("div");d.className="msg "+cls;
 const b=document.createElement("b");b.textContent=who+": ";
 d.appendChild(b);d.appendChild(document.createTextNode(text));
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function reply(text){add("JARVIS",text,"jarvis");speak(text)}
function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-IN";u.rate=.9;u.pitch=.9;speechSynthesis.speak(u);
}
function send(){const t=input.value.trim();if(!t)return;input.value="";process(t)}
function listen(){
 if(!recognition){add("JARVIS","Voice recognition is not available in this browser. Use the text box.","jarvis");return}
 try{recognition.start()}catch(e){}
}
if(window.SpeechRecognition||window.webkitSpeechRecognition){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang="en-IN";
 recognition.onstart=()=>{status.textContent="V3 • LISTENING...";add("JARVIS","I am listening...","jarvis")}
 recognition.onresult=e=>{const t=e.results[0][0].transcript;process(t)}
 recognition.onerror=()=>{status.textContent="V3 • SYSTEM ONLINE";reply("I could not hear you. Please try again.")}
 recognition.onend=()=>status.textContent="V3 • SYSTEM ONLINE";
}
function process(command){
 add("YOU",command,"user");
 const t=command.toLowerCase().trim();

 if(/^(hello|hi|hey|नमस्कार|हॅलो|हलो)/.test(t)){reply("Hello. I am JARVIS. How can I assist you?");return}
 if(t.includes("who are you")||t.includes("तू कोण")||t.includes("तुम कौन")){reply("I am JARVIS, your personal AI assistant.");return}
 if(t.includes("time")||t.includes("वेळ")||t.includes("समय")){reply("The current time is "+new Date().toLocaleTimeString());return}
 if(t.includes("date")||t.includes("तारीख")||t.includes("आजची तारीख")){reply("Today is "+new Date().toLocaleDateString());return}
 if(t.includes("youtube")||t.includes("यूट्यूब")){reply("Opening YouTube.");setTimeout(openYouTube,500);return}
 if(t.includes("google")||t.includes("गूगल")){reply("Opening Google.");setTimeout(()=>window.open("https://www.google.com","_blank"),500);return}
 if(t.startsWith("search ")||t.startsWith("find ")||t.includes("शोध")){
   let q=command.replace(/^(search|find)\s+/i,"").trim();
   if(!q)q=prompt("What should I search?");
   if(q){reply("Searching the web for "+q);setTimeout(()=>window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank"),500)}
   return;
 }
 if(t.includes("good morning")){reply("Good morning. All JARVIS systems are online.");return}
 if(t.includes("good night")){reply("Good night. JARVIS is standing by.");return}
 if(t.includes("thank")){reply("You're welcome. Always at your service.");return}
 if(t.includes("how are you")){reply("All systems are operational.");return}

 // Backend-ready AI hook. Keep the API key OUT of this file.
 reply("I understand your command. My secure AI brain can be connected to a backend next.");
}
function openYouTube(){window.open("https://www.youtube.com","_blank")}
function searchPrompt(){const q=prompt("What should I search?");if(q)window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank")}
function clearChat(){chat.innerHTML='<div class="msg jarvis"><b>JARVIS:</b> Chat cleared. I am ready.</div>'}
</script>
</body>
</html>
