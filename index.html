```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020914">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #063b5a 0%, #020914 42%, #000308 100%);
    color: #dff8ff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 18px;
}

.title {
    font-size: 30px;
    letter-spacing: 10px;
    color: #00d9ff;
    text-shadow: 0 0 10px #00d9ff, 0 0 30px #008cff;
    margin-top: 10px;
}

.status {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #73eaff;
}

.hud {
    position: relative;
    width: min(78vw, 330px);
    height: min(78vw, 330px);
    margin-top: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid #00cfff;
    box-shadow:
        0 0 10px #00cfff,
        inset 0 0 15px #008cff;
}

.r1 {
    width: 100%;
    height: 100%;
    animation: spin 12s linear infinite;
}

.r2 {
    width: 82%;
    height: 82%;
    border-style: dashed;
    animation: spinReverse 8s linear infinite;
}

.r3 {
    width: 64%;
    height: 64%;
    animation: pulse 2s infinite;
}

.core {
    width: 35%;
    height: 35%;
    border-radius: 50%;
    background: radial-gradient(circle, #bfffff 0%, #00d9ff 25%, #006cff 60%, #00152a 100%);
    box-shadow:
        0 0 20px #00eaff,
        0 0 60px #008cff,
        0 0 100px #0066ff;
    animation: pulse 1.5s infinite;
}

.panel {
    width: 100%;
    max-width: 500px;
    margin-top: 25px;
    min-height: 90px;
    padding: 16px;
    border: 1px solid #008cff;
    border-radius: 14px;
    background: rgba(0, 20, 40, 0.65);
    box-shadow: 0 0 20px rgba(0, 180, 255, 0.25);
    text-align: center;
}

#output {
    font-size: 16px;
    line-height: 1.5;
}

.controls {
    width: 100%;
    max-width: 500px;
    margin-top: 18px;
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    min-height: 52px;
    border-radius: 12px;
    border: 1px solid #00cfff;
    background: rgba(0, 100, 180, 0.2);
    color: #dff8ff;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(0, 190, 255, 0.2);
}

button:active {
    background: rgba(0, 190, 255, 0.45);
    transform: scale(.97);
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes spinReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">JARVIS</div>
    <div class="status" id="status">SYSTEM ONLINE</div>

    <div class="hud">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"></div>
    </div>

    <div class="panel">
        <div id="output">
            Hello. I am JARVIS.<br>
            Tap the microphone and speak.
        </div>
    </div>

    <div class="controls">
        <button onclick="startListening()">🎙️ SPEAK</button>
        <button onclick="jarvisSearch()">🌐 SEARCH</button>
    </div>

</div>

<script>

const output = document.getElementById("output");
const statusText = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-IN";

    recognition.onstart = function () {
        statusText.innerText = "LISTENING...";
        output.innerText = "I am listening...";
    };

    recognition.onresult = function (event) {

        const command =
            event.results[0][0].transcript;

        output.innerHTML =
            "<b>You:</b> " + command +
            "<br><br><b>JARVIS:</b> ";

        processCommand(command);
    };

    recognition.onerror = function () {

        statusText.innerText = "SYSTEM ONLINE";

        output.innerText =
            "I could not hear you. Please try again.";
    };

    recognition.onend = function () {
        statusText.innerText = "SYSTEM ONLINE";
    };

} else {

    output.innerText =
        "Speech recognition is not supported in this browser.";
}


function startListening() {

    if (!recognition) return;

    recognition.start();
}


function processCommand(command) {

    const text = command.toLowerCase();

    let response = "";

    if (
        text.includes("hello") ||
        text.includes("hi") ||
        command.includes("नमस्कार")
    ) {

        response =
            "Hello. I am JARVIS. How can I assist you?";

    }

    else if (
        text.includes("who are you") ||
        command.includes("तू कोण")
    ) {

        response =
            "I am JARVIS, your personal AI assistant.";

    }

    else if (
        text.includes("time") ||
        command.includes("वेळ")
    ) {

        const now = new Date();

        response =
            "The current time is " +
            now.toLocaleTimeString();

    }

    else if (
        text.includes("date") ||
        command.includes("तारीख")
    ) {

        const now = new Date();

        response =
            "Today is " +
            now.toLocaleDateString();

    }

    else if (
        text.includes("youtube")
    ) {

        response =
            "Opening YouTube.";

        speak(response);

        setTimeout(() => {
            window.open(
                "https://www.youtube.com",
                "_blank"
            );
        }, 700);

        return;
    }

    else if (
        text.includes("google")
    ) {

        response =
            "Opening Google.";

        speak(response);

        setTimeout(() => {
            window.open(
                "https://www.google.com",
                "_blank"
            );
        }, 700);

        return;
    }

    else {

        response =
            "I heard you say: " +
            command +
            ". My AI brain will be connected in the next version.";

    }

    output.innerHTML =
        "<b>You:</b> " + command +
        "<br><br><b>JARVIS:</b> " +
        response;

    speak(response);
}


function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-IN";
    voice.rate = 0.9;
    voice.pitch = 0.9;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);
}


function jarvisSearch() {

    const query =
        prompt("What should I search?");

    if (!query)
        return;

    speak("Searching the web.");

    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
    );
}

</script>

</body>
</html>
